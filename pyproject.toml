[project]
name = "iot-guard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.3,<7", "httpx>=0.28.1,<0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
iot-guard = "iot_guard.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["iot_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
