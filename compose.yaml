services:
  iot-guard:
    # Built by .github/workflows/image.yml. On the Pi (no repo checkout):
    #   docker compose pull && docker compose up -d --no-build
    # Locally, `docker compose up -d --build` builds from source instead.
    image: ghcr.io/dmechas/iot-guard:main
    build: .
    restart: unless-stopped
    environment:
      ROUTEROS_URL: https://192.168.88.1
      ROUTEROS_USER: iot-guard
      ROUTEROS_PASSWORD_FILE: /run/secrets/routeros_password
      ROUTEROS_CA_CERT: /certs/local-ca.pem   # export from the router: /certificate export-certificate local-ca
      IOT_GUARD_CONFIG: /config/config.yaml
      IOT_GUARD_OUI: /data/oui.csv
    # Start with --dry-run; remove it to go live (plan step 6).
    command: ["run", "--dry-run"]
    secrets:
      - routeros_password
    volumes:
      # Mount the directory, not the file: editors save by replacing the file, and a
      # single-file bind mount would keep showing the old one, so reloads would never happen.
      - ./config:/config:ro
      - ./certs:/certs:ro
      - oui-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

secrets:
  routeros_password:
    # One line, the router password. The container runs as uid 10001 and must be able to read it:
    #   sudo chown 10001 secrets/routeros_password && sudo chmod 400 secrets/routeros_password
    file: ./secrets/routeros_password

volumes:
  oui-data:
